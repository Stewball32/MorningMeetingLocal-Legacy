<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<title>Birthday cake</title>
	<!-- The calendar's birthday picture when the person has none: big, simple shapes so it reads
	     in a small day cell. -->
	<!-- plate -->
	<ellipse cx="256" cy="452" rx="214" ry="30" fill="#b9c4cc" />
	<ellipse cx="256" cy="444" rx="214" ry="26" fill="#dfe6ea" />
	<!-- bottom layer -->
	<rect x="86" y="292" width="340" height="150" rx="22" fill="#e85d8f" />
	<rect x="86" y="372" width="340" height="22" fill="#f48fb1" />
	<!-- top layer -->
	<rect x="146" y="196" width="220" height="112" rx="20" fill="#f48fb1" />
	<rect x="146" y="262" width="220" height="16" fill="#f8bbd0" />
	<!-- icing on the top layer, dripping -->
	<rect x="140" y="186" width="232" height="34" rx="17" fill="#fff6e5" />
	<circle cx="178" cy="222" r="13" fill="#fff6e5" />
	<circle cx="226" cy="226" r="11" fill="#fff6e5" />
	<circle cx="276" cy="222" r="14" fill="#fff6e5" />
	<circle cx="330" cy="225" r="12" fill="#fff6e5" />
	<!-- icing on the bottom layer, dripping -->
	<rect x="78" y="282" width="356" height="38" rx="19" fill="#fff6e5" />
	<circle cx="116" cy="322" r="15" fill="#fff6e5" />
	<circle cx="178" cy="328" r="13" fill="#fff6e5" />
	<circle cx="244" cy="322" r="16" fill="#fff6e5" />
	<circle cx="312" cy="327" r="13" fill="#fff6e5" />
	<circle cx="384" cy="322" r="15" fill="#fff6e5" />
	<!-- sprinkles -->
	<g stroke-width="9" stroke-linecap="round">
		<path d="M128 404 l14 -8" stroke="#ffd54f" />
		<path d="M196 414 l14 6" stroke="#4fc3f7" />
		<path d="M268 404 l12 -9" stroke="#81c784" />
		<path d="M336 414 l14 5" stroke="#ffd54f" />
		<path d="M392 400 l10 -10" stroke="#4fc3f7" />
		<path d="M178 250 l12 -7" stroke="#ffd54f" />
		<path d="M236 256 l13 5" stroke="#4fc3f7" />
		<path d="M296 248 l11 -8" stroke="#81c784" />
		<path d="M338 258 l12 4" stroke="#ffd54f" />
	</g>
	<!-- candles -->
	<rect x="190" y="104" width="24" height="88" rx="8" fill="#4fc3f7" />
	<rect x="244" y="94" width="24" height="98" rx="8" fill="#ffd54f" />
	<rect x="298" y="104" width="24" height="88" rx="8" fill="#81c784" />
	<g fill="#ffffff" fill-opacity="0.55">
		<rect x="190" y="126" width="24" height="10" />
		<rect x="190" y="158" width="24" height="10" />
		<rect x="244" y="118" width="24" height="10" />
		<rect x="244" y="150" width="24" height="10" />
		<rect x="298" y="126" width="24" height="10" />
		<rect x="298" y="158" width="24" height="10" />
	</g>
	<!-- flames -->
	<g fill="#ffa000">
		<path d="M202 40 C220 66 224 84 202 96 C180 84 184 66 202 40 Z" />
		<path d="M256 30 C274 56 278 74 256 86 C234 74 238 56 256 30 Z" />
		<path d="M310 40 C328 66 332 84 310 96 C288 84 292 66 310 40 Z" />
	</g>
	<g fill="#fff176">
		<path d="M202 62 C210 74 212 82 202 88 C192 82 194 74 202 62 Z" />
		<path d="M256 52 C264 64 266 72 256 78 C246 72 248 64 256 52 Z" />
		<path d="M310 62 C318 74 320 82 310 88 C300 82 302 74 310 62 Z" />
